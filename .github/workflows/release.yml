name: Release

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Nightly release (uses "nightly" tag)
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Checkout spotube gradle plugin
        uses: actions/checkout@v7
        with:
          repository: team-spotube/gradle-plugin
          path: spotube-gradle-plugin

      - name: Publish spotube gradle plugin to maven local
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal
        working-directory: spotube-gradle-plugin

      - name: Random BS Go
        run: |
          cat << 'EOF' > spotube_plugin_youtube_music/local.properties
          cookie=my-fav-cookie
          dataSyncId=abs-not
          visitorId=lol
          EOF

      - name: Build plugin
        run: |
          chmod +x ./gradlew
          ./gradlew :spotube_plugin_youtube_music:packageProductionPlugin

      - name: Read version from plugin.json
        if: ${{ !inputs.nightly }}
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: spotube_plugin_youtube_music/plugin.json
          prop_path: version

      - name: Set tag name
        id: tag
        run: |
          if [ "${{ inputs.nightly }}" = "true" ]; then
            echo "tag=nightly" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ steps.version.outputs.prop }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release asset
        run: cp spotube_plugin_youtube_music/build/distributions/plugin-production.smplug plugin.smplug

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.nightly }}
          files: plugin.smplug
          fail_on_unmatched_files: true
