name: Nightly Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_PLUGIN_REPO: team-spotube/gradle-plugin
  SPOTUBE_KMP_REPO: team-spotube/spotube-kmp

jobs:
  build:
    name: Build & Publish Nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout gradle-plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GRADLE_PLUGIN_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: gradle-plugin

      - name: Checkout spotube-kmp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SPOTUBE_KMP_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: spotube-kmp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish gradle-plugin to mavenLocal
        working-directory: gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Publish plugin_interfaces to mavenLocal
        working-directory: spotube-kmp
        run: |
          chmod +x gradlew
          ./gradlew :plugin_interfaces:publishToMavenLocal

      - name: Write buildkonfig placeholders
        run: |
          mkdir -p spotube_plugin_youtube_music
          echo "cookie=placeholder" >> spotube_plugin_youtube_music/local.properties
          echo "visitorId=placeholder" >> spotube_plugin_youtube_music/local.properties
          echo "dataSyncId=placeholder" >> spotube_plugin_youtube_music/local.properties

      - name: Package production plugin
        run: |
          chmod +x gradlew
          ./gradlew :spotube_plugin_youtube_music:packageProductionPlugin --no-configuration-cache

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytm-plugin
          path: spotube_plugin_youtube_music/build/distributions/plugin-production.smplug

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag nightly
          git push origin nightly

      - name: Create nightly release
        run: |
          gh release create nightly \
            --title "Nightly Build" \
            --notes "Automated nightly build: $(date +'%Y-%m-%d %H:%M UTC') — $(git rev-parse --short HEAD)" \
            --prerelease \
            spotube_plugin_youtube_music/build/distributions/plugin-production.smplug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
